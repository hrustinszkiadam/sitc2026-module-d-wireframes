<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stations — none nearby</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="phone">
  <header class="app-topbar">
    <a class="brand" href="stations.html">SwapLoop <span>Lin Xiaoyu · SWAPPABLE / SL-48</span></a>
  </header>

  <main class="app-main app-main--with-nav">
    <h1>Stations</h1>

    <div class="filter-bar" role="group" aria-label="Station type">
      <button type="button" class="chip" aria-pressed="true">All types</button>
      <button type="button" class="chip" aria-pressed="false">Swap</button>
      <button type="button" class="chip" aria-pressed="false">Charging</button>
      <button type="button" class="chip" aria-pressed="false">Hybrid</button>
    </div>
    <div class="filter-bar" role="group" aria-label="Additional filters">
      <button type="button" class="chip" aria-pressed="false">Compatible availability</button>
      <button type="button" class="chip" aria-pressed="true">Nearby · radius 1500 m</button>
    </div>

    <div class="empty-state">
      <span class="icon-box" aria-hidden="true" style="width:1.6rem;height:1.6rem;"></span>
      <h2>No station within 1.5 km</h2>
      <p>Your device location doesn&#39;t have a SwapLoop station within the current radius. Widen the search or turn off Nearby to browse all stations.</p>
      <a href="stations.html" class="btn btn--primary">Turn off Nearby</a>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="Primary">
    <a href="stations.html" aria-current="page"><span class="icon-box" aria-hidden="true"></span>Stations</a>
    <a href="scan.html"><span class="icon-box" aria-hidden="true"></span>Scan</a>
    <a href="activity.html"><span class="icon-box" aria-hidden="true"></span>Activity</a>
    <a href="profile.html"><span class="icon-box" aria-hidden="true"></span>Profile</a>
  </nav>
</div>
</body>
</html>
