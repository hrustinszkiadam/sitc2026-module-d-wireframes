<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — SwapLoop</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="phone">
  <header class="app-topbar">
    <a class="brand" href="stations.html">SwapLoop <span>Lin Xiaoyu · SWAPPABLE / SL-48</span></a>
  </header>

  <main class="app-main app-main--with-nav">
    <h1>Profile</h1>

    <div class="panel" style="display:flex; align-items:center; gap:0.75rem;">
      <span class="icon-box" aria-hidden="true" style="width:2.75rem; height:2.75rem; border-radius:50%;"></span>
      <div>
        <strong style="display:block; font-size:1.0625rem;">Lin Xiaoyu</strong>
        <span class="link-muted">lin.xiaoyu@swaploop.test</span>
      </div>
    </div>

    <div class="panel">
      <span class="section-label">Account</span>
      <dl class="summary-list">
        <div><dt>Role</dt><dd>RIDER</dd></div>
        <div><dt>Status</dt><dd>ACTIVE</dd></div>
      </dl>
    </div>

    <div class="panel">
      <span class="section-label">Vehicle profile</span>
      <dl class="summary-list">
        <div><dt>Battery mode</dt><dd>SWAPPABLE</dd></div>
        <div><dt>Battery type</dt><dd>SL-48</dd></div>
        <div><dt>Voltage class</dt><dd>48V (derived)</dd></div>
        <div><dt>Current battery</dt><dd>battery-014</dd></div>
      </dl>
    </div>

    <div class="btn-row">
      <a href="profile-edit.html" class="btn btn--block">Edit profile</a>
    </div>
    <div class="btn-row" style="margin-top:0.6rem;">
      <a href="index.html" class="btn btn--danger btn--block">Sign out</a>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="Primary">
    <a href="stations.html"><span class="icon-box" aria-hidden="true"></span>Stations</a>
    <a href="scan.html"><span class="icon-box" aria-hidden="true"></span>Scan</a>
    <a href="activity.html"><span class="icon-box" aria-hidden="true"></span>Activity</a>
    <a href="profile.html" aria-current="page"><span class="icon-box" aria-hidden="true"></span>Profile</a>
  </nav>
</div>
</body>
</html>
