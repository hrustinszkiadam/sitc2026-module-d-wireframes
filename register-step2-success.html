<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — Alipay linked</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="phone">
  <main class="auth-main">
    <div class="brand-block">
      <a class="brand" href="index.html">SwapLoop</a>
      <p>Create your rider account</p>
    </div>

    <h1 class="sr-only">Create account — Alipay linked</h1>

    <div class="step-indicator">
      <span class="step step--done"><span class="step-dot">&#10003;</span> Profile</span>
      <span class="step-sep"></span>
      <span class="step step--done"><span class="step-dot">&#10003;</span> Alipay link</span>
    </div>

    <section class="panel" style="text-align:center;">
      <div class="alert alert--success" style="justify-content:center;">
        <span class="icon-box" aria-hidden="true"></span>
        <strong>Alipay linked successfully</strong>
      </div>

      <div class="media-placeholder" style="min-height:8rem; margin-bottom:0.9rem;">
        <span>Linked account: alipay-mock-8821</span>
      </div>

      <p class="lede">Pay-as-you-go is ready. Create your account to start using SwapLoop.</p>
    </section>

    <div class="form-actions" style="border-top:0; padding-top:0;">
      <a href="stations.html" class="btn btn--primary btn--block">Create account</a>
    </div>
  </main>
</div>
</body>
</html>
