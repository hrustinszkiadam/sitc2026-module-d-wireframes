<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity — ready for collection</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="phone">
  <header class="app-topbar">
    <a class="brand" href="stations.html">SwapLoop <span>Chen Wei · INTEGRATED / GB-AC-48</span></a>
  </header>

  <main class="app-main app-main--with-nav">
    <h1>Activity</h1>

    <section class="panel">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:0.5rem; margin-bottom:0.5rem;">
        <h2 style="margin:0;">Charging bay · Riverside Charging Hub</h2>
        <span class="status-badge">Ready for collection</span>
      </div>

      <div class="telemetry-grid">
        <div class="telemetry-tile">
          <span class="tele-value">100%</span>
          <span class="tele-label">SOC</span>
        </div>
        <div class="telemetry-tile">
          <span class="tele-value">0W</span>
          <span class="tele-label">Power</span>
        </div>
        <div class="telemetry-tile">
          <span class="tele-value">27°C</span>
          <span class="tele-label">Temp</span>
        </div>
      </div>

      <p class="lede">Charging finished. Collect your e-bike from Bay B2 to close out this session and see the receipt.</p>

      <div class="btn-row">
        <a href="activity-charging-receipt.html" class="btn btn--primary btn--block">Collect bike</a>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Primary">
    <a href="stations.html"><span class="icon-box" aria-hidden="true"></span>Stations</a>
    <a href="scan.html"><span class="icon-box" aria-hidden="true"></span>Scan</a>
    <a href="activity.html" aria-current="page"><span class="icon-box" aria-hidden="true"></span>Activity</a>
    <a href="profile.html"><span class="icon-box" aria-hidden="true"></span>Profile</a>
  </nav>
</div>
</body>
</html>
